name: Trusted synthetic PR checks

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-synthetic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-synthetic-checks:
    name: trusted-synthetic-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on foreign head repositories
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$TRUSTED_REPOSITORY" ]; then
            echo 'Foreign head repositories are not authorized for this synthetic gate.' >&2
            exit 1
          fi
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Trusted exact scope before candidate execution
        run: >-
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          timeout 30s python3 -I -S -B
          trusted/validator03_scope.py candidate trusted/immutable-files.sha256
      - name: Trusted bounded syntax before candidate execution
        run: >-
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          timeout 30s python3 -I -S -B
          trusted/validator01_syntax.py candidate
      - name: Trusted behavior on bounded candidate
        run: >-
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          timeout 30s python3 -I -S -B
          trusted/validator02_behavior.py candidate task
      - name: Immutable candidate unit tests last
        run: >-
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          timeout 60s python3 -I -S -B -m unittest discover -s candidate -v
